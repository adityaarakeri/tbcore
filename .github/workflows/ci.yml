name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test with coverage
        run: pytest -m "not installed_wheel and not live" --cov=tbcore --cov-report=term-missing

  distribution:
    name: built distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Validate artifacts and installed wheel
        run: python scripts/verify_distribution.py dist

  docker:
    name: installed-wheel sandbox integration (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel in a clean environment
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv .workflow-venv
          .workflow-venv/bin/python -m pip install dist/*.whl pytest
      - name: Build sandbox and proxy images
        run: .workflow-venv/bin/python -c "import tbcore; print(tbcore.build_default_images())"
      - name: Docker-marked tests
        run: .workflow-venv/bin/python -m pytest -m "docker and not live" -v
