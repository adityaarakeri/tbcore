[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tbcore"
version = "0.1.0"
description = "Token-build core: accounted model clients, resumable execution pools, sandboxing, and stats."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "tbcore contributors" }]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: integration tests that require a working container runtime",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
