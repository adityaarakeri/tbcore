[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tbcore"
dynamic = ["version"]
description = "Token-build core: accounted model clients, resumable execution pools, sandboxing, and stats."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aditya Arakeri" }]
keywords = ["llm", "anthropic", "openai", "ollama", "batch", "sandbox", "token-accounting", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
]

[project.urls]
Homepage = "https://github.com/adityaarakeri/tbcore"
Source = "https://github.com/adityaarakeri/tbcore"
Issues = "https://github.com/adityaarakeri/tbcore/issues"
Changelog = "https://github.com/adityaarakeri/tbcore/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = { attr = "tbcore.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tbcore = ["py.typed", "images/sandbox/*", "images/proxy/*", "images/codex/*"]

[tool.mypy]
python_version = "3.11"
files = ["src/tbcore"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: integration tests that require a working container runtime",
    "installed_wheel: integration tests that require tbcore imported from a wheel environment",
    "live: opt-in paid provider smoke tests",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
